<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Agent — live ReAct trace</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --line:#2a2f3a; --text:#e6e8ee; --muted:#9aa3b2; --accent:#d97757; --ok:#4fb477; --err:#e5534b; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif; background:var(--bg); color:var(--text); }
  main { max-width:860px; margin:0 auto; padding:32px 16px; }
  h1 { font-size:22px; margin:0 0 4px; } p.sub { color:var(--muted); margin:0 0 24px; }
  form { display:flex; gap:8px; flex-wrap:wrap; }
  textarea { flex:1 1 100%; min-height:72px; padding:12px; border-radius:10px; border:1px solid var(--line); background:var(--panel); color:var(--text); font:inherit; resize:vertical; }
  input { flex:1; min-width:0; padding:10px 12px; border-radius:10px; border:1px solid var(--line); background:var(--panel); color:var(--text); font:inherit; }
  button { padding:10px 18px; border:0; border-radius:10px; background:var(--accent); color:#fff; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:wait; }
  #trace { margin-top:24px; display:grid; gap:12px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px 16px; }
  .card h3 { margin:0 0 6px; font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); }
  .card.final { border-color:var(--accent); }
  .action { margin-top:8px; padding:10px; border-radius:8px; background:#0b0d11; font:13px/1.45 ui-monospace,Menlo,monospace; white-space:pre-wrap; word-break:break-word; }
  .action b { color:var(--accent); } .ok { color:var(--ok); } .err { color:var(--err); }
  .meta { color:var(--muted); font-size:12px; margin-top:16px; }
</style>
</head>
<body>
<main>
  <h1>AI Agent</h1>
  <p class="sub">ReAct loop on the Claude API — watch each THINK → ACT → OBSERVE step stream in over SSE.</p>
  <form id="f">
    <textarea id="goal" required>What is 15% of the sum of the first 20 prime numbers? Show your work.</textarea>
    <input id="session" placeholder="session id (optional, keeps conversation memory)">
    <input id="key" type="password" placeholder="X-API-Key (if the server requires one)">
    <button id="go">Run</button>
  </form>
  <div id="trace"></div>
  <div class="meta" id="meta"></div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function render(event, data) {
  if (event === "run_started") {
    $("meta").textContent = `run ${data.run_id} · session ${data.session_id}`;
    if (!$("session").value) $("session").value = data.session_id;
    return;
  }
  const card = document.createElement("div");
  card.className = "card" + (data.is_final ? " final" : "");
  const title = data.is_final ? "Final answer" : `Step ${data.step_number}`;
  let html = `<h3>${title}</h3>`;
  if (data.is_final) html += `<div>${esc(data.final_answer).replace(/\n/g, "<br>")}</div>`;
  else if (data.thought) html += `<div>${esc(data.thought)}</div>`;
  for (const a of data.actions || []) {
    html += `<div class="action"><b>${esc(a.tool_name)}</b>(${esc(JSON.stringify(a.tool_input))})\n` +
            `<span class="${a.success ? "ok" : "err"}">→ ${esc(a.result)}</span></div>`;
  }
  card.innerHTML = html;
  $("trace").appendChild(card);
}

$("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("trace").innerHTML = ""; $("go").disabled = true;
  const headers = { "Content-Type": "application/json" };
  if ($("key").value) headers["X-API-Key"] = $("key").value;
  const body = { goal: $("goal").value };
  if ($("session").value) body.session_id = $("session").value;
  try {
    const res = await fetch("/run", { method: "POST", headers, body: JSON.stringify(body) });
    if (!res.ok) throw new Error(`${res.status} ${(await res.json()).detail ?? ""}`);
    const reader = res.body.pipeThrough(new TextDecoderStream()).getReader();
    let buf = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += value.replace(/\r\n/g, "\n");
      let i;
      while ((i = buf.indexOf("\n\n")) >= 0) {
        const chunk = buf.slice(0, i); buf = buf.slice(i + 2);
        const event = (chunk.match(/^event: (.*)$/m) || [])[1];
        const data = chunk.split("\n").filter((l) => l.startsWith("data: ")).map((l) => l.slice(6)).join("\n");
        if (event && data) render(event, JSON.parse(data));
      }
    }
  } catch (err) {
    render("error", { is_final: true, final_answer: `Request failed: ${err.message}` });
  } finally {
    $("go").disabled = false;
  }
});
</script>
</body>
</html>
